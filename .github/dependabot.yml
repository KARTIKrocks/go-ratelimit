version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /redisstore
      - /metrics
      - /examples/basic
      - /examples/multitier
      - /examples/redis
      - /examples/prometheus
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    labels:
      - ci
    open-pull-requests-limit: 5
